name: Compile and Deploy Firmware

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 1: Check if an Arduino sketch exists in the root directory
      - name: Check for Arduino Sketch File
        id: check_sketch
        run: |
          if ls *.ino 1> /dev/null 2>&1; then
            echo "has_sketch=true" >> $GITHUB_OUTPUT
            echo "Sketch file found. Proceeding with compilation."
          else
            echo "has_sketch=false" >> $GITHUB_OUTPUT
            echo "No .ino file found in root directory. Skipping compilation step."
          fi

      # Step 2: Install Arduino CLI & ESP32 Core (Only runs if a sketch exists)
      - name: Setup Arduino CLI
        if: steps.check_sketch.outputs.has_sketch == 'true'
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Platform
        if: steps.check_sketch.outputs.has_sketch == 'true'
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      # Step 3: Compile Sketch to /flash/ directory (Only runs if a sketch exists)
      - name: Compile Arduino Sketch
        if: steps.check_sketch.outputs.has_sketch == 'true'
        run: |
          SKETCH_FILE=$(ls *.ino | head -n 1)
          mkdir -p flash
          arduino-cli compile --fqbn esp32:esp32:esp32c3 --output-dir ./flash "$SKETCH_FILE"

      # Step 4: Upload Artifact for GitHub Pages deployment
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './flash'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
